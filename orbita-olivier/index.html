<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0c11">
<meta name="description" content="Орбита Оливье — космическая 3D-аркада. Перехвати салатный флот и одолей флагман за пять волн.">
<title>Орбита Оливье · Orbital Arcade</title>
<link rel="icon" href="assets/arcade.svg" type="image/svg+xml">
<link rel="preload" as="image" href="assets/invasion.webp">
<link rel="stylesheet" href="style.css">
<script type="module" src="arcade.js"></script>
</head>
<body>
<svg class="sprites" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
<symbol id="alien" viewBox="0 0 24 24"><path fill="currentColor" d="M4 2h2v2h2v2h8V4h2V2h2v2h-2v2h-2v2h4v2h2v2h2v7h-3v-4h-2v4H5v-4H3v4H0v-7h2v-2h2V8h4V6H6V4H4zm3 9v3h3v-3zm7 0v3h3v-3zM5 20h5v2H5zm9 0h5v2h-5z"/></symbol>
<symbol id="volume" viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3zM16 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></symbol>
<symbol id="mute" viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3zM16 9l6 6m0-6-6 6"/></symbol>
<symbol id="play" viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M6 3.8a.8.8 0 0 1 1.2-.7l14 8.2a.8.8 0 0 1 0 1.4l-14 8.2a.8.8 0 0 1-1.2-.7z"/></symbol>
<symbol id="pad" viewBox="0 0 24 24"><path d="M6.5 6h11c2 0 3 2 3.5 4.5l1 5c.7 4-2.1 4.9-4 2.9L15 15H9l-3 3.4c-2 2-4.7 1-4-3l1-5C3.5 8 4.4 6 6.5 6zM5.5 10.8h5M8 8.4v4.8m7.5-1.3h.1m2.5-2.1h.1"/></symbol>
<symbol id="target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="2"/><path d="M12 1v5m0 12v5M1 12h5m12 0h5"/></symbol>
<symbol id="trophy" viewBox="0 0 24 24"><path d="M7 3h10v5c0 4-1.8 6-5 6s-5-2-5-6zM7 5H3v2q0 4 5 4m9-6h4v2q0 4-5 4m-4 3v5m-5 2h10m-7-2h4"/></symbol>
<symbol id="layers" viewBox="0 0 24 24"><path d="m2 8 10-5 10 5-10 5zM3 12l9 5 9-5M3 16l9 5 9-5"/></symbol>
<symbol id="shield" viewBox="0 0 24 24"><path d="m12 2 8 3v6c0 5-4.5 8.7-8 11-3.5-2.3-8-6-8-11V5z"/><path d="m8 12 3 3 5-6"/></symbol>
<symbol id="arrow" viewBox="0 0 24 24"><path d="M6 18 18 6M6 6h12v12"/></symbol>
<symbol id="wave" viewBox="0 0 24 24"><path d="m2 12 4-5 5 11 4-14 4 8h3"/></symbol>
<symbol id="pause" viewBox="0 0 24 24"><path d="M8 4v16m8-16v16" stroke-width="4"/></symbol>
<symbol id="bolt" viewBox="0 0 24 24"><path d="m13 2-9 12h7l-1 8 10-13h-7z"/></symbol>
<symbol id="close" viewBox="0 0 24 24"><path d="m5 5 14 14m0-14L5 19"/></symbol>
</defs></svg>
<header class="mast"><div class="shell mast-inner">
<a class="brand" href="#arcade" aria-label="Orbital Arcade — игровая"><svg class="brand-icon"><use href="#alien"/></svg><span>ORBITAL<span class="brand-light"> ARCADE</span></span></a>
<nav aria-label="Навигация"><a class="nav-active" href="#arcade">Игровая</a><a href="#atlas">Атлас</a><button id="recordsNav">Рекорды</button></nav>
<button id="sound" class="sound" aria-pressed="true"><svg><use href="#volume"/></svg><span>Звук вкл.</span></button>
</div></header>
<main class="shell">
<section id="arcade" aria-label="Игровой экран">
<div class="cabinet" id="cabinet">
<div class="stage" id="stage">
<div class="poster" aria-hidden="true"></div>
<div class="poster-shade"></div>
<span class="corner c-tl" aria-hidden="true"></span><span class="corner c-tr" aria-hidden="true"></span><span class="corner c-bl" aria-hidden="true"></span><span class="corner c-br" aria-hidden="true"></span>
<div class="intro" id="intro">
<div class="genre"><span class="led"></span> КОСМИЧЕСКАЯ 3D-АРКАДА</div>
<h1><span>ОРБИТА</span><em>ОЛИВЬЕ</em></h1>
<p>Салатный флот вышел на орбиту. Прорвись через пять волн и отправь флагман обратно в салатницу.</p>
<div class="actions"><button class="primary" id="launch"><svg><use href="#play"/></svg>Начать игру</button><button class="secondary" id="help"><svg><use href="#pad"/></svg>Как играть</button></div>
</div>
<div class="scene-label" aria-hidden="true"><i></i> СЕКТОР 01 <b>/</b> ОРБИТА ЗЕМЛИ</div>
<div class="battle" id="battle" hidden>
<canvas id="stars"></canvas><canvas id="models"></canvas><canvas id="fx" tabindex="0" aria-label="Поле боя. Стрелки или WASD — полёт, пробел — импульс, P — пауза."></canvas>
<div class="top-hud"><span class="flight-led"><i></i> ВЫЛЕТ <b id="hudWave">01/05</b></span><span id="bossBar" hidden>ФЛАГМАН <i><b></b></i></span><button id="pauseGame" class="toolbtn" aria-label="Пауза"><svg><use href="#pause"/></svg></button></div>
<div class="callout" id="callout" aria-live="polite"></div>
<div class="bottom-hud"><span class="flight-score" id="flightScore">000000</span><button id="pulse" class="pulse"><svg><use href="#bolt"/></svg><span>Импульс</span></button></div>
</div>
</div>
<div class="readouts"><div class="readout"><svg><use href="#layers"/></svg><div><span>ВОЛНА</span><strong id="statWave">01 <small>/ 05</small></strong></div></div><div class="readout"><svg><use href="#trophy"/></svg><div><span>ЛИЧНЫЙ РЕКОРД</span><strong id="statBest">000000</strong></div></div><div class="readout"><svg><use href="#shield"/></svg><div><span>ЩИТ КОРАБЛЯ</span><strong class="shield-pips" id="shieldPips" aria-label="3 из 3"><i></i><i></i><i></i></strong></div></div></div>
</div></section>
<section class="atlas" id="atlas" aria-labelledby="atlasTitle"><div class="atlas-heading"><div><div class="eyebrow"><i></i> БАЗА ДАННЫХ</div><h2 id="atlasTitle">Атлас захватчиков</h2></div><span class="atlas-count"><svg><use href="#target"/></svg> 03 ОБЪЕКТА</span></div>
<div class="cards">
<button class="card pea" data-enemy="0"><span class="thumb"><img src="assets/pea.webp" alt=""></span><span class="card-copy"><span class="class-name">РАЗВЕДЧИК</span><strong>Горошек</strong><span class="pts">100 очков</span></span><svg class="card-arrow"><use href="#arrow"/></svg></button>
<button class="card pickle" data-enemy="1"><span class="thumb"><img src="assets/pickle.webp" alt=""></span><span class="card-copy"><span class="class-name">ПЕРЕХВАТЧИК</span><strong>Огурец</strong><span class="pts">250 очков</span></span><svg class="card-arrow"><use href="#arrow"/></svg></button>
<button class="card boss" data-enemy="2"><span class="thumb"><img src="assets/flagship.webp" alt=""></span><span class="card-copy"><span class="class-name">ФЛАГМАН</span><strong>Салатница</strong><span class="pts">2 000 очков</span></span><svg class="card-arrow"><use href="#arrow"/></svg></button>
</div></section>
</main>
<dialog id="dialog" aria-labelledby="dialogTitle"><div class="dialog-body"><button id="closeDialog" class="toolbtn close" aria-label="Закрыть"><svg><use href="#close"/></svg></button><div class="eyebrow" id="dialogKicker"></div><h2 id="dialogTitle"></h2><div id="dialogContent"></div></div></dialog>
<noscript>Для игры включите JavaScript в браузере.</noscript>
</body></html>
